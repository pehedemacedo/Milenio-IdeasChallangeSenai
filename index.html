<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202632">
  <title>Milênio — Chão de Fábrica</title>
  <link rel="icon" href="assets/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm" hidden>
    <div class="container-fluid px-lg-4">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#painel" data-view="painel">
        <img src="assets/logo.png" alt="Milênio" class="brand-logo">
        <span class="brand-name">Milênio <small>CHÃO DE FÁBRICA</small></span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <div class="navbar-nav ms-lg-4 me-auto">
          <a class="nav-link active" href="#painel" data-view="painel">Painel</a>
          <a class="nav-link" href="#ops" data-view="ops">Ordens de produção</a>
          <a class="nav-link" href="#maquinas" data-view="maquinas">Máquinas</a>
          <a class="nav-link" href="#desenhos" data-view="desenhos">Desenhos</a>
          <a class="nav-link" href="#paradas" data-view="paradas">Paradas e refugo</a>
          <a class="nav-link" href="#alertas" data-view="alertas">Alertas</a>
          <a class="nav-link" href="#qrcodes" data-view="qrcodes">Etiquetas QR</a>
          <a class="nav-link" href="#integracao" data-view="integracao">Ponte para máquinas</a>
        </div>
        <div class="navbar-text d-flex align-items-center gap-2 py-2 py-lg-0">
          <span class="demo-dot"></span><span class="small text-white-50">Demonstração local</span>
          <span id="badgeProfile" class="small text-white-50 ms-lg-2"></span>
          <button class="btn btn-sm btn-outline-light" data-action="badge-logout" hidden>Sair</button>
          <button class="btn btn-sm btn-outline-light ms-lg-2" data-action="settings">Ajustes</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container-fluid px-3 px-lg-4 py-4" id="viewRoot" aria-live="polite"></main>

  <div class="modal fade" id="actionModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow">
        <form id="modalForm">
          <div class="modal-header">
            <div><div class="eyebrow">MILÊNIO · CHÃO DE FÁBRICA</div><h2 class="modal-title fs-5" id="modalTitle">Ação</h2></div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body" id="modalBody"></div>
          <div class="modal-footer" id="modalFooter"></div>
        </form>
      </div>
    </div>
  </div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="qrcode.min.js"></script>
  <script src="jsQR.min.js"></script>
  <script src="badge-auth.js?v=3"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
